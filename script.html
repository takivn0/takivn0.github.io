<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <title>Script chi tiết | TakiVN Scripts</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="scripts-data.js"></script>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="TakiVN Scripts — trang chủ">
        <img src="assets/logo.png" alt="" class="logo" onerror="this.style.display='none'">
        <span>TakiVN <strong>Scripts</strong></span>
      </a>
      <nav aria-label="Điều hướng chính"><a href="index.html">← Trang chủ</a></nav>
    </div>
  </header>

  <main class="detail-main">
    <div class="script-detail" id="scriptDetail">
      <div class="detail-loading">Đang tải script...</div>
    </div>
  </main>

  <footer><p>&copy; 2026 TakiVN Roblox Scripts. Đéo hợp tác với Roblox.</p></footer>

  <script>
  const params = new URLSearchParams(window.location.search);
  const data = window.scripts && window.scripts[params.get('id')];

  function renderDetail() {
    const detail = document.getElementById('scriptDetail');
    if (!data) {
      detail.innerHTML = '<div class="detail-error"><span>404</span><h1>Không tìm thấy script</h1><a href="index.html" class="back-btn">← Quay lại trang chủ</a></div>';
      return;
    }

    document.title = data.title + ' | TakiVN Scripts';
    detail.innerHTML = `
      <a href="index.html" class="back-btn">← Quay lại</a>
      <div class="detail-header">
        <img src="${data.image}" alt="${data.title}" class="script-detail-img">
        <div>
          <p class="eyebrow detail-eyebrow"><span></span> Script details</p>
          <h1>${data.title}</h1>
          <p class="script-detail-desc">${data.desc}</p>
        </div>
      </div>
      <div class="code-shell">
        <div class="code-toolbar"><span>Lua</span><button class="copy-btn" type="button">Copy</button></div>
        <pre class="script-detail-code" id="codeArea"><code>${data.code.replace(/[&<>]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]))}</code></pre>
      </div>
    `;

    document.querySelector('.copy-btn').addEventListener('click', async function () {
      try {
        await navigator.clipboard.writeText(data.code);
        this.textContent = 'Đã copy ✓';
        this.classList.add('copied');
        setTimeout(() => { this.textContent = 'Copy'; this.classList.remove('copied'); }, 1600);
      } catch (_) {
        this.textContent = 'Không thể copy';
      }
    });
  }
  renderDetail();
  </script>
</body>
</html>
